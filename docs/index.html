<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f73">
  <meta name="description" content="PlumpPad — scorekeeping for the card game Plump.">
  <title>PlumpPad</title>
  <link rel="stylesheet" href="assets/site.css">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>
<body>
<main class="language-chooser">
  <section class="language-panel" aria-labelledby="title">
    <picture>
      <source srcset="assets/app-icon-dark.png" media="(prefers-color-scheme: dark)">
      <img src="assets/app-icon.png" alt="PlumpPad app icon" width="132" height="132">
    </picture>
    <h1 id="title">PlumpPad</h1>
    <p class="lead">Choose language · Välj språk</p>
    <div class="actions">
      <a class="button primary" href="sv/" lang="sv">Svenska</a>
      <a class="button" href="en/" lang="en">English</a>
    </div>
  </section>
</main>
<script src="assets/site.js" defer></script>
</body>
</html>
